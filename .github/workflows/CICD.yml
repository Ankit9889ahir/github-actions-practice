name: CICD
on:
  workflow_dispatch:
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: clone the code
        run: echo "cloning the code"
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: build the code
        run: echo "building the code"
  test:
    needs: [code,build]
    runs-on: ubuntu-latest
    steps:
      - name: test the code
        run: echo "Testing the code"

  deploy:
    needs: [code,build,test]
    runs-on: ubuntu-latest
    steps:
      - name: deploy the code
        run: echo "deploying the app"
        
      
      
